[project]
name = "docean-setup-guide"
version = "0.1.0"
description = "Walkthrough guide for setting up Imbue Studio on DigitalOcean"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "markdown-it-py>=3.0",
]

[project.scripts]
docean-setup-guide = "docean_setup_guide.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docean_setup_guide"]
